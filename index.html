<!DOCTYPE html>
<html>
<head>
    <title>Custom Router</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="pathfinding.js"></script>
    <style> #map { height: 100vh; width: 100%; } body { margin: 0; } </style>
</head>
<body>
    <header>
        <h1>Custom Router</h1>
        <p>Click on the map to set a start and end point, then watch the pathfinding algorithm in action!</p>
        <select id="algorithm">
            <option value="dijkstra">Dijkstra's Algorithm</option>
            <option value="aStar">A* Search</option>
            <option value="greedBestFirst">Greedy Best-First Search</option>
            <option value="biDijkstra">Bidirectional Dijkstra's Algorithm</option>
            <option value="LLMAStar">LLM-Augmented A* Search</option>
        </select>
        <button onclick="runBenchmark()">Run Benchmark</button>
    </header>
    <div id="map"></div>
</body>
</html>
